name: Releaser Pleaser

# Keeps a release PR open with the next version and the changelog, computed
# from the Conventional Commits on main. Merging that PR tags vX.Y.Z and
# creates the GitHub release; the tag then runs the release workflow.
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - edited
      - labeled

concurrency:
  group: releaser-pleaser
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  releaser-pleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag pushed with GITHUB_TOKEN does not trigger other workflows, so the
      # release would never be built. The crstian19-releaser GitHub App mints a
      # short-lived token that does, and its key does not expire like a PAT.
      - name: Generate release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Run Releaser Pleaser
        uses: apricote/releaser-pleaser@v0.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
