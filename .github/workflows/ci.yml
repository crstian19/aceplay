name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Run tests
      run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    # Runs the linter set from .golangci.yml (govet included, so no separate
    # go vet step). Pinned instead of "latest" so a new release cannot turn CI
    # red on its own — Renovate bumps it.
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.13.2
        args: --timeout=5m

    # `go fmt ./...` rewrites files and always exits 0, so it can never fail a
    # build. This checks formatting instead of applying it.
    - name: Check formatting
      run: golangci-lint fmt --diff

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Build
      run: make build

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: aceplay-linux-amd64
        path: build/aceplay
