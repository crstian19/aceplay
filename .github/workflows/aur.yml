name: AUR Publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  aur-publish:
    name: Publish to AUR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout main
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: false

    - name: Get tag version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION=$VERSION"

    - name: Debug
      run: |
        echo "VERSION: $VERSION"
        echo "=== Current directory ==="
        pwd
        ls -la
        echo "=== Scripts ==="
        ls -la scripts/

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      run: |
        go build -ldflags "-X main.version=$VERSION" -o aceplay ./cmd
        ls -la aceplay

    - name: Configure Git
      run: |
        git config --global user.name "${{ secrets.AUR_USERNAME }}"
        git config --global user.email "${{ secrets.AUR_EMAIL }}"

    - name: Prepare aceplay-bin
      run: |
        set -e
        echo "Starting prepare..."
        mkdir -p /tmp/aceplay-bin
        echo "Copying PKGBUILD.bin..."
        cp scripts/PKGBUILD.bin /tmp/aceplay-bin/PKGBUILD || { echo "Failed to copy PKGBUILD.bin"; exit 1; }
        cp scripts/aceplay.desktop /tmp/aceplay-bin/
        cp scripts/LICENSE /tmp/aceplay-bin/
        cp aceplay /tmp/aceplay-bin/aceplay || { echo "Failed to copy aceplay binary"; exit 1; }
        sed -i "s/pkgver=.*/pkgver=$VERSION/" /tmp/aceplay-bin/PKGBUILD || { echo "Failed to sed"; exit 1; }
        ls -la /tmp/aceplay-bin/
        echo "Done!"

    - name: Publish aceplay-bin to AUR
      env:
        AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$AUR_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        echo "Host aur.archlinux.org" > ~/.ssh/config
        echo "    HostName aur.archlinux.org" >> ~/.ssh/config
        echo "    User aur" >> ~/.ssh/config
        echo "    IdentityFile ~/.ssh/id_ed25519" >> ~/.ssh/config
        echo "    StrictHostKeyChecking no" >> ~/.ssh/config
        git clone aur@aur.archlinux.org:aceplay-bin.git /tmp/aceplay-bin-repo || git clone ssh://aur@aur.archlinux.org/aceplay-bin.git /tmp/aceplay-bin-repo
        cd /tmp/aceplay-bin-repo
        cp /tmp/aceplay-bin/* .
        git add .
        git commit -m "Update to v$VERSION" || echo "Nothing to commit"
        git push origin master

    - name: Prepare aceplay
      run: |
        mkdir -p /tmp/aceplay
        cp scripts/PKGBUILD /tmp/aceplay/PKGBUILD
        cp scripts/aceplay.desktop /tmp/aceplay/
        cp scripts/LICENSE /tmp/aceplay/
        sed -i "s/pkgver=.*/pkgver=$VERSION/" /tmp/aceplay/PKGBUILD

    - name: Publish aceplay to AUR
      env:
        AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      run: |
        git clone aur@aur.archlinux.org:aceplay.git /tmp/aceplay-repo
        cd /tmp/aceplay-repo
        cp /tmp/aceplay/* .
        git add .
        git commit -m "Update to v$VERSION" || echo "Nothing to commit"
        git push origin master
