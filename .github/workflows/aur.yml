name: AUR Publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  aur-publish:
    name: Publish to AUR
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get tag version
      run: |
        VERSION="${GITHUB_REF#refs/tags/v}"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Debug
      run: |
        echo "VERSION: $VERSION"
        ls -la scripts/

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build
      run: |
        go build -ldflags "-X main.version=$VERSION" -o aceplay ./cmd

    - name: Configure Git
      run: |
        git config --global user.name "${{ secrets.AUR_USERNAME }}"
        git config --global user.email "${{ secrets.AUR_EMAIL }}"

    - name: Prepare aceplay-bin
      run: |
        mkdir -p /tmp/aceplay-bin
        cp scripts/PKGBUILD.bin /tmp/aceplay-bin/PKGBUILD
        cp scripts/aceplay.desktop /tmp/aceplay-bin/
        cp scripts/LICENSE /tmp/aceplay-bin/
        cp aceplay /tmp/aceplay-bin/aceplay
        sed -i "s/pkgver=.*/pkgver=$VERSION/" /tmp/aceplay-bin/PKGBUILD

    - name: Publish aceplay-bin to AUR
      env:
        AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      run: |
        mkdir -p ~/.ssh
        echo "$AUR_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        chmod 700 ~/.ssh
        ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true
        GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" git clone aur@aur.archlinux.org:aceplay-bin.git /tmp/aceplay-bin-repo || true
        cd /tmp/aceplay-bin-repo
        cp /tmp/aceplay-bin/* .
        git add .
        git commit -m "Update to v$VERSION" || echo "No changes"
        GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" git push origin master || echo "Push failed"

    - name: Prepare aceplay
      run: |
        mkdir -p /tmp/aceplay
        cp scripts/PKGBUILD /tmp/aceplay/PKGBUILD
        cp scripts/aceplay.desktop /tmp/aceplay/
        cp scripts/LICENSE /tmp/aceplay/
        sed -i "s/pkgver=.*/pkgver=$VERSION/" /tmp/aceplay/PKGBUILD

    - name: Publish aceplay to AUR
      env:
        AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      run: |
        GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" git clone aur@aur.archlinux.org:aceplay.git /tmp/aceplay-repo || true
        cd /tmp/aceplay-repo
        cp /tmp/aceplay/* .
        git add .
        git commit -m "Update to v$VERSION" || echo "No changes"
        GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" git push origin master || echo "Push failed"
