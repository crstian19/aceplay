name: AUR Publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  aur-publish:
    name: Publish to AUR
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version
      id: extract_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build Linux binary
      run: |
        go build -ldflags "-X main.version=${{ steps.extract_version.outputs.VERSION }}" -o aceplay ./cmd

    - name: Prepare aceplay-bin files
      run: |
        mkdir -p aur-aceplay-bin
        cp scripts/PKGBUILD.bin aur-aceplay-bin/PKGBUILD
        cp scripts/.SRCINFO.bin aur-aceplay-bin/.SRCINFO
        cp scripts/aceplay.desktop aur-aceplay-bin/
        cp scripts/LICENSE aur-aceplay-bin/
        cp aceplay aur-aceplay-bin/aceplay
        sed -i 's/pkgver=.*/pkgver=${{ steps.extract_version.outputs.VERSION }}/' aur-aceplay-bin/PKGBUILD

    - name: Prepare aceplay files
      run: |
        mkdir -p aur-aceplay
        cp scripts/PKGBUILD aur-aceplay/PKGBUILD
        cp scripts/aceplay.desktop aur-aceplay/
        cp scripts/LICENSE aur-aceplay/
        sed -i 's/pkgver=.*/pkgver=${{ steps.extract_version.outputs.VERSION }}/' aur-aceplay/PKGBUILD
        # Download source for aceplay (compiles from source)
        cd aur-aceplay
        curl -sL "https://github.com/crstian19/aceplay/archive/v${{ steps.extract_version.outputs.VERSION }}.tar.gz" -o source.tar.gz

    - name: Publish aceplay-bin to AUR
      uses: ulises-jeremias/github-actions-aur-publish@v1
      with:
        pkgname: aceplay-bin
        pkgbuild: ./aur-aceplay-bin/PKGBUILD
        commit_username: ${{ secrets.AUR_USERNAME }}
        commit_email: ${{ secrets.AUR_EMAIL }}
        ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
        commit_message: "Update to v${{ steps.extract_version.outputs.VERSION }}"
        ssh_keyscan_types: rsa,dsa,ecdsa,ed25519

    - name: Publish aceplay to AUR
      uses: ulises-jeremias/github-actions-aur-publish@v1
      with:
        pkgname: aceplay
        pkgbuild: ./aur-aceplay/PKGBUILD
        commit_username: ${{ secrets.AUR_USERNAME }}
        commit_email: ${{ secrets.AUR_EMAIL }}
        ssh_private_key: ${{ secrets.AUR_SSH_KEY }}
        commit_message: "Update to v${{ steps.extract_version.outputs.VERSION }}"
        ssh_keyscan_types: rsa,dsa,ecdsa,ed25519
