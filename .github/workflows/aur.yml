name: AUR Publish

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  aur-publish:
    name: Publish to AUR
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version
      id: extract_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Build Linux binary
      run: |
        go build -ldflags "-X main.version=${{ steps.extract_version.outputs.VERSION }}" -o aceplay ./cmd

    - name: Configure Git
      run: |
        git config --global user.name "${{ secrets.AUR_USERNAME }}"
        git config --global user.email "${{ secrets.AUR_EMAIL }}"

    - name: Prepare aceplay-bin files
      run: |
        mkdir -p /tmp/aceplay-bin
        cp scripts/PKGBUILD.bin /tmp/aceplay-bin/PKGBUILD
        cp scripts/.SRCINFO.bin /tmp/aceplay-bin/.SRCINFO
        cp scripts/aceplay.desktop /tmp/aceplay-bin/
        cp scripts/LICENSE /tmp/aceplay-bin/
        cp aceplay /tmp/aceplay-bin/aceplay
        sed -i 's/pkgver=.*/pkgver=${{ steps.extract_version.outputs.VERSION }}/' /tmp/aceplay-bin/PKGBUILD

    - name: Publish aceplay-bin to AUR
      env:
        AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      run: |
        chmod 600 /tmp/aur_key
        echo "$AUR_SSH_KEY" > /tmp/aur_key
        chmod 600 /tmp/aur_key
        git clone ssh://aur@aur.archlinux.org/aceplay-bin.git /tmp/aceplay-bin-repo
        cd /tmp/aceplay-bin-repo
        cp /tmp/aceplay-bin/* .
        git add .
        git commit -m "Update to v${{ steps.extract_version.outputs.VERSION }}"
        GIT_SSH_COMMAND="ssh -i /tmp/aur_key -o StrictHostKeyChecking=no" git push origin master

    - name: Prepare aceplay files
      run: |
        mkdir -p /tmp/aceplay
        cp scripts/PKGBUILD /tmp/aceplay/PKGBUILD
        cp scripts/aceplay.desktop /tmp/aceplay/
        cp scripts/LICENSE /tmp/aceplay/
        sed -i 's/pkgver=.*/pkgver=${{ steps.extract_version.outputs.VERSION }}/' /tmp/aceplay/PKGBUILD

    - name: Publish aceplay to AUR
      env:
        AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      run: |
        echo "$AUR_SSH_KEY" > /tmp/aur_key
        chmod 600 /tmp/aur_key
        git clone ssh://aur@aur.archlinux.org/aceplay.git /tmp/aceplay-repo
        cd /tmp/aceplay-repo
        cp /tmp/aceplay/* .
        git add .
        git commit -m "Update to v${{ steps.extract_version.outputs.VERSION }}"
        GIT_SSH_COMMAND="ssh -i /tmp/aur_key -o StrictHostKeyChecking=no" git push origin master
